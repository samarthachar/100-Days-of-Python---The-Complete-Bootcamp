<!DOCTYPE html>
<html>
    <head>
        <title>Sam's Watches</title>
        <link rel = "icon" href = "https://cdn-icons-png.flaticon.com/512/9098/9098010.png" type = "image/icon">
    </head>
    <body class = "bg">
        <style>
            .bg{
                background-image: url(https://w0.peakpx.com/wallpaper/784/284/HD-wallpaper-red-grey-abstract-background-black-colors-fade-gradient-oneplus-oneplus-6t-texture-ultra.jpg) ; 
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-size: 100% 100%;
            }
            .Header1{
                font-family: ar destine;
                color: white;
                width: 300px;
                border: 15px solid whitesmoke;
                padding: 5px;
                margin: 20px; 
            }
            .Watch{
                padding: 20px;
                margin: 1%;
                border:10px solid whitesmoke;
                border-color: whitesmoke;
            }
            .column {
            float: left;
            width: 32%;
            padding: 5px;
          }
          
          .row::after {
            content: "";
            clear: both;
            display: table;
          }
          .text{
            font-family: impact;
            font-size:50px;
            color: whitesmoke;
          }
          .wrapper{
            background: transparent;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 2px solid whitesmoke;
            padding: 10px;
            outline: transparent;
            width: 500px;
            color: white;
            border-radius: 10px;
            text-align: center; 
            position: relative;
          }

          .input-box input::placeholder {
          color: rgba(235,235,235,0.75);

        }
             .input-box {
            position: relative;
            font-size: 20px;
            width: 75%;
            height: 20px;
            margin: 30px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            outline: none;
            border: 2px solid rgba(255 ,255 ,255 ,0.2);
            border-radius: 100px;
            font-size: 20px;
            color: white;
            padding: 20px 45px 20px 20px;
        }



        .input-box i {
            position: absolute;
            cursor: default;
            top: 50%;

            font-size: 20px;
        }
        .button {
            position: relative;
            width: 500px;
            height: 45px;
            background: transparent;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font-size: 20px;
            color: white;
            font-weight: 600;
            align-items: center;
        }
        .wrapper .btn {
            width: 100%;
            height: 45px;
            background: white;
            border: 2px solid rgba(255 ,255 ,255 ,0.2);
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font-size: 20px;
            color: #333;
            font-weight: 600;
            margin-bottom: 30px;
        }



        </style>
        <center>
            <h1 class = "Header1">Sam's Watches</h1>
            <hr width="100%" style="height: 3px; fill: whitesmoke;">
            <p>
                <form action="get">
                    
                    <div class = "wrapper">

                        <div class="input-box">
                            <input type="text" name="Name" placeholder="Name" required>
                        </div><br>

                        <div class="input-box">
                            <input type="email" name="email" placeholder="email" required>
                        </div><br>

                        <div class="input-box">
                            <input type="number" name="mobileNo" placeholder="Phone Number" required>
                        </div><br>

                        <div class="input-box">
                            <input type="text" name="comments" placeholder="Any comments?" required>
                        </div><br><br>

                        <button type="submit" class="button">Buy Now</button>
                    </div>
                </form>
            </p>
    </center>
    </body>
</html>
